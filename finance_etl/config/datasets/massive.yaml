# @package datasets

massive_daily_ticker_summary:
  _target_: ccflow_etl.DatasetDefinition
  name: massive-daily-ticker-summary
  description: Massive daily aggregate payloads for configured stock tickers.
  schema_name: massive_daily_aggregate_response
  schema_version: "1"
  partition_keys:
    - date
    - ticker
  cadence: 1D
  media_types:
    - application/json
  quality_expectations:
    - one payload per ticker/date
    - provider response status is OK
  destination_hints:
    raw_prefix: massive/daily-ticker-summary/raw/{date}/{ticker}.json
