# @package providers

massive:
  _target_: ccflow_etl.ProviderDefinition
  name: massive
  description: Massive REST market-data provider.
  provider_type: http
  dataset_refs:
    - /datasets/massive_daily_ticker_summary
  credentials_ref: /credentials/massive
  capabilities:
    - templated_http_requests
    - pagination
    - http_status_retry
    - rate_limit_headers
  rate_limit:
    source: provider_headers
  retry:
    retry_status_codes:
      - 429
      - 500
      - 502
      - 503
      - 504
  request_templates:
    daily_aggregate: /v2/aggs/ticker/{ticker}/range/1/day/{date}/{date}
