[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "finance-etl"
authors = [
    {name = "PrettyGoodCapital", email = "prettygoodcapital@gmail.com"},
]
description = "Standard financial ETL workflows"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.10"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "ccflow>=0.6.10",
    "ccflow-etl>=0.2.0",
    "ccflow-http",
    "finance-dates",
]

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "codespell",
    "hatchling",
    "mdformat",
    "mdformat-tables>=1",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
]

[project.scripts]

[project.entry-points."hydra.lernaplugins"]
finance-etl = "pkg:finance_etl.config"

[project.urls]
Repository = "https://github.com/PrettyGoodCapital/finance-etl"
Homepage = "https://github.com/PrettyGoodCapital/finance-etl"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "finance_etl/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.coverage.run]
branch = true
omit = [
    "finance_etl/tests/integration/",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = []

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = [
    "finance_etl",
]

[tool.hatch.build.targets.wheel]
packages = [
    "finance_etl",
]

[tool.hatch.build.targets.wheel.shared-data]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "finance_etl/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "finance_etl",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

[tool.yardang]
title = "finance-etl"
root = "README.md"
pages = [
    "docs/src/calendars.md",
    "docs/src/providers.md",
    "docs/src/development.md",
    "docs/src/api.md",
]
use-autoapi = false
autodoc-pydantic-field-list-validators = false
autodoc-pydantic-field-show-constraints = false
autodoc-pydantic-model-show-config-summary = false
autodoc-pydantic-model-show-field-summary = false
autodoc-pydantic-model-show-validator-members = false
autodoc-pydantic-model-show-validator-summary = false
autodoc-pydantic-settings-show-json = false
